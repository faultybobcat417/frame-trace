[project]
name = "frame-trace"
version = "1.0.3"
description = "Local-first visual relationship explorer for authorized media."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3",
  "typer>=0.20,<1",
  "rich>=13,<16",
  "numpy>=2.1,<3",
  "scikit-learn>=1.7,<2",
  "opencv-python-headless>=4.10,<5",
  "httpx>=0.28,<1",
  "websockets>=14,<16"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8"
]

[project.scripts]
frame-trace = "frame_trace.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
pythonpath = ["backend"]

[tool.coverage.run]
source = ["backend/frame_trace"]
omit = ["*/__main__.py"]
